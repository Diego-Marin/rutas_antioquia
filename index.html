<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Mapa · Colombia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="logo-dot"></span>
            <span class="logo-text">Mi Mapa</span>
        </div>

        <div class="progress-pill" id="progressPill">
            <span id="progressCount">0</span>/<span id="progressTotal">0</span>
        </div>

        <div class="topbar-actions">
            <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
            <button class="icon-btn" id="resetBtn" aria-label="Reiniciar mapa">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-3-6.7" />
                    <path d="M21 3v6h-6" />
                </svg>
            </button>
        </div>
    </header>

    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <main class="app-main">

        <!-- SECCIÓN DE MAPA (Espacio reservado para SVG final) -->
        <section class="map-section">
            <div class="map-viewport" id="mapViewport">

                <div class="map-zoom-target" id="mapZoomTarget">
                    <!-- ESPACIO RESERVADO PARA EL SVG FINAL -->
                    <svg id="mapaSvg" class="mapa-svg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
                        <g id="regiones">
                            <!-- Aquí pegarás los <path data-name="NombreMunicipio"> del SVG definitivo -->
                        </g>
                    </svg>
                </div>

                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomInBtn" aria-label="Acercar">+</button>
                    <button class="zoom-btn" id="zoomOutBtn" aria-label="Alejar">−</button>
                    <button class="zoom-btn zoom-btn-reset" id="zoomResetBtn" aria-label="Restablecer zoom">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
                        </svg>
                    </button>
                </div>

                <p class="map-hint" id="mapHint">Toca una zona del mapa o marca municipios desde la lista</p>
            </div>
        </section>

        <!-- LISTA Y BUSCADOR -->
        <section class="list-section">
            <div class="list-search">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar municipio o departamento..." autocomplete="off">
            </div>

            <ul class="region-list" id="regionList"></ul>
        </section>

    </main>

    <button class="fab-export" id="exportBtn" aria-label="Exportar mapa como JPG">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v13M6 11l6 6 6-6M4 21h16" />
        </svg>
        <span>Exportar</span>
    </button>

    <div class="toast" id="toast"></div>
    <canvas id="exportCanvas" style="display:none;"></canvas>

    <script src="map-data.js"></script>
    <script src="main.js"></script>
</body>

</html>
